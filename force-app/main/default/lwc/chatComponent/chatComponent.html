<template>
   <template if:true={hasActiveProvider}>
   <div class="custom-card slds-card">
      <template if:true={isPermissionError}>
         <div class="slds-p-around_medium">
            You do not have the required permissions to access this feature.
         </div>
      </template>
      <template if:true={showTemplateModal}>
         <div if:false={isMobile}>
            <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="modal-heading-01"
               class="slds-modal slds-fade-in-open slds-modal_large">
               <div class="slds-modal__container">
                  <header class="slds-modal__header">
                     <button class="slds-button slds-button_icon slds-modal__close" onclick={closeModal}>
                        <lightning-icon icon-name="utility:close" alternative-text="Close" size="medium"
                           variant="inverse"></lightning-icon>
                     </button>
                     <h2 class="slds-modal__title">{label.SELECT_TEMPLATE_LABEL}</h2>
                  </header>
                  <div class="slds-modal__content slds-p-around_medium">
                     <div class="slds-form-element slds-p-bottom_small">
                        <div class="slds-form-element__control">
                           <input type="text" id="templateSearch" class="slds-input slds-size_1-of-3"
                              placeholder="Search Template Name" oninput={handleSearch}>
                        </div>
                     </div>
                     <table class="slds-table slds-table_bordered slds-table_cell-buffer">
                        <thead>
                           <tr class="slds-line-height_reset">
                              <th scope="col" class="slds-text-heading_small heading" style="width: 30%;">
                                 {label.NAME_LABEL}
                              </th>
                              <th scope="col" class="slds-text-heading_small heading" style="width: 45%;">
                                 {label.MESSAGE_BODY_LABEL}
                              </th>
                              <th scope="col" class="slds-text-heading_small heading" style="width: 25%;">
                                 {label.CHANNEL_LABEL}
                              </th>
                           </tr>
                        </thead>
                        <tbody>
                           <template for:each={filteredTemplates} for:item="template">
                              <tr key={template.Id} onclick={handleRowClick} data-id={template.Id}
                                 class="slds-hint-parent">
                                 <td data-label="Name" class="slds-truncate" data-recordid={template.Id}>
                                    <a onclick={handleTemplateName}>{template.SmartMsg__Template_Name__c}</a>
                                 </td>
                                 <td data-label="Message Body" class="slds-truncate slds-truncate-wrap">
                                    {template.SmartMsg__Body__c}
                                 </td>
                                 <td data-label="Channel" class="slds-truncate">{template.SmartMsg__Channel__c}</td>
                              </tr>
                           </template>
                        </tbody>
                     </table>
                  </div>
                  <footer class="slds-modal__footer">
                  </footer>
               </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
         </div>
         <div if:true={isMobile}>
            <div class="modal__container slds-card">
               <div class="modal__header">
                  <button class="slds-button slds-button_icon modal__close " onclick={closeModal}>
                     <lightning-icon icon-name="utility:close" alternative-text="Close" size="small"></lightning-icon>
                  </button>
                  <h2 class="__title">{label.SELECT_TEMPLATE_LABEL}</h2>
               </div>
               <div class="modal__content slds-p-around_medium">
                  <div class="slds-form-element slds-p-bottom_small">
                     <div class="slds-form-element__control">
                        <input type="text" id="templateSearch1" class="slds-input slds-size_1-of-3"
                           placeholder="Search Template Name" oninput={handleSearch}>
                     </div>
                  </div>
                  <table class="slds-table slds-table_bordered slds-table_cell-buffer">
                     <thead>
                        <tr class="slds-line-height_reset">
                           <th scope="col" class="slds-text-title_caps" style="width: 30%;">{label.NAME_LABEL}
                           </th>
                           <th scope="col" class="slds-text-title_caps" style="width: 45%;">
                              {label.MESSAGE_BODY_LABEL}
                           </th>
                           <th scope="col" class="slds-text-title_caps" style="width: 25%;">
                              {label.CHANNEL_LABEL}
                           </th>
                        </tr>
                     </thead>
                     <tbody>
                        <template for:each={filteredTemplates} for:item="template">
                           <tr key={template.Id} onclick={handleRowClick} data-id={template.Id}
                              class="slds-hint-parent">
                              <td data-label="Name" class="slds-truncate">{template.SmartMsg__Template_Name__c}</td>
                              <td data-label="Message Body" class="slds-truncate slds-truncate-wrap">
                                 {template.SmartMsg__Body__c}
                              </td>
                              <td data-label="Channel" class="slds-truncate">{template.SmartMsg__Channel__c}</td>
                           </tr>
                        </template>
                     </tbody>
                  </table>
               </div>
            </div>
         </div>
      </template>
      <template if:true={showMediaUrlModal}>
         <!-- Whatss App -->
         <div if:false={isMobile}>
            <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="modal-heading-01"
               class="slds-modal slds-fade-in-open slds-modal_small">
               <div class="slds-modal__container">
                  <header class="slds-modal__header">
                     <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                        title="Close" onclick={closeMediaUrlModal}>
                        <lightning-icon icon-name="utility:close" alternative-text="close" size="small"
                           variant="inverse"></lightning-icon>
                        <span class="slds-assistive-text">{label.CLOSE_LABEL}</span>
                     </button>
                     <h2 class="slds-text-heading_medium">{label.ENTER_MEDIA_URL_LABEL}</h2>
                  </header>
                  <div class="slds-modal__content slds-p-around_medium">
                     <div if:true={isDocument}>
                        <lightning-input label="File Name" value={fileName} onchange={handleFileNameChange} required disabled={isAutoReplyEnabled}>
                        </lightning-input>
                        <template if:true={fileNameError}>
                           <p class="slds-text-color_error">File Name is required.</p>
                        </template>
                     </div>
                     <lightning-input label="Media URL" value={mediaUrl} onchange={handleMediaUrlChange} required disabled={isAutoReplyEnabled}>
                     </lightning-input>
                     <template if:true={mediaUrlError}>
                        <p class="slds-text-color_error">Media URL is required.</p>
                     </template>
                  </div>
                  <footer class="slds-modal__footer">
                     <button class="slds-button slds-button_neutral"
                        onclick={closeMediaUrlModal}>{label.CANCEL_LABEL}</button>
                     <button class="slds-button slds-button_brand"
                        onclick={handleSaveMediaUrl} disabled={isAutoReplyEnabled}>{label.SAVE_LABEL}</button>
                  </footer>
               </div>
               <!-- <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
                  </section> -->
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
         </div>
         <template if:true={isMobile}>
            <div class="mediaUrl__container slds-card">
               <div class="media__header">
                  <button class="slds-button slds-button_icon modal__close" onclick={closeMediaUrlModal}>
                     <lightning-icon icon-name="utility:close" alternative-text="Close" size="small"></lightning-icon>
                     <span class="slds-assistive-text">{label.CLOSE_LABEL}</span>
                  </button>
                  <h2 class="media-title">{label.ENTER_MEDIA_URL_LABEL}</h2>
               </div>
               <div class="media__content slds-p-around_medium">
                  <div if:true={isDocument}>
                     <lightning-input label="File Name" value={fileName} onchange={handleFileNameChange} required disabled={isAutoReplyEnabled}>
                     </lightning-input>
                     <template if:true={fileNameError}>
                        <p class="slds-text-color_error">File Name is required.</p>
                     </template>
                  </div>
                  <lightning-input label="Media URL" value={mediaUrl} onchange={handleMediaUrlChange} required disabled={isAutoReplyEnabled}>
                  </lightning-input>
                  <template if:true={mediaUrlError}>
                     <p class="slds-text-color_error">Media URL is required.</p>
                  </template>
               </div>
               <div class="media__footer">
                  <button class="slds-button slds-button_neutral"
                     onclick={closeMediaUrlModal}>{label.CANCEL_LABEL}</button>
                  <button class="slds-button slds-button_brand" onclick={handleSaveMediaUrl} disabled={isAutoReplyEnabled}>{label.SAVE_LABEL}</button>
               </div>
            </div>
         </template>
      </template>
      <template if:false={isPermissionError}>
         <div class="sticky-container">
         <!-- <div class="slds-card__header margin-zero"> 
            <div class="slds-media"> 
            
                <div class="slds-media__figure"> 
            
                </div> 
            
                <div class="slds-media__body"> 
            
                    <h2 class="slds-card__header-title">{contactName}</h2> 
            
                </div> 
            
            </div> 
            
            </div> -->
         <div class="slds-card__body margin-zero">
            <div class="scrollable-container">
               <template if:false={hideUtilityBarElements}>
                  <div class="slds-card__header" style="padding-top: 12px;">
                     <div class="slds-media">
                        <div class="slds-media__figure"></div>
                        <div class="slds-media__body">
                           <!-- <h2 class="slds-card__header-title">{contactName}</h2> -->
                           <!-- <lightning-icon icon-name="standard:live_chat" alternative-text="close" size="Medium" style="background:transparent"></lightning-icon> -->
                           <h2 class="slds-card__header-title">
                              <img src={aiStar} alt="Image" class="Header-logo" />Messenger
                           </h2>
                           <!--div class="header-right"-->
                           <!-- </template> -->
                           <div class="icon-container">
                              <template if:true={showTwilioFromNumberDropdown}>
                                 <div class="from-number-top-wrapper">
                                    <span class="from-number-label">From :</span>
                                    <lightning-combobox name="twilioFromNumber" value={selectedTwilioFromNumber}
                                       options={twilioFromNumberOptions} onchange={handleTwilioFromNumberChange}
                                       placeholder="Select From Number" variant="label-hidden" dropdown-alignment="auto"
                                       class="from-number-dropdown-top" aria-label="Select From Number (Twilio WhatsApp)">
                                    </lightning-combobox>
                                 </div>
                              </template>
                              <template if:true={selectedContact}>
                                 <template if:false={isCaseRecord}>
                                 <!-- <div class="Contact-Switch"> 
                                 <lightning-icon icon-name="standard:people" size="small" 
                                 
                                     alternative-text="Refresh" class="contact-icon" 
                                 
                                     onclick={handleContactSwitch}></lightning-icon> 
                                 
                                 <lightning-icon icon-name="utility:down" size="x-small" 
                                 
                                     alternative-text="Refresh" class="down-icon" onclick={handleContactSwitch} 
                                 
                                     style="fill:#fff"></lightning-icon> 
                                 
                                 </div> -->
                                 <c-generic-lookup parent-object-name={objectApiName} parent-id={recordId}
                                    display-fields="Name,Phone" icon-name="utility:search" placeholder="Search Contact"
                                    selected-record={selectedContact} default-selected-option={defaultSelectedOption}
                                    onselect={handleContactSelected} class="search-contact">
                                 </c-generic-lookup>
                                 </template>
                              </template>
                              <!-- <lightning-button-icon icon-name="utility:search" alternative-text="Search Messages" 
                              size="x-large" onclick={toggleSearch} class="search-icon" title="Search Messages"> 
                              
                              </lightning-button-icon> -->
                              <div class="wa-header-row">
                                 <template if:true={showChatbotToggle}>
                                    <div class="wa-toggle-vertical">
                                       <label class="wa-toggle-wrapper">
                                          <input
                                             type="checkbox"
                                             class="wa-toggle-input"
                                             checked={isAutoReplyEnabled}
                                             onchange={handleAutoReplyChange}
                                             role="switch"
                                             aria-checked={isAutoReplyEnabled}
                                          />
                                          <span class="wa-toggle-slider"></span>
                                       </label>
                                       <div class="wa-toggle-subtitle">Auto-Response</div>
                                    </div>
                                 </template>
                                 <div class="refresh-desktop">
                                    <lightning-icon icon-name="action:refresh" size="small" alternative-text="Refresh"
                                       class="refresh-icon" onclick={handleRefresh} title="Refresh Conversation">
                                    </lightning-icon>
                                 </div>
                              </div>
                              <lightning-button-menu icon-name="utility:threedots_vertical"
                                 alternative-text="More Options" menu-alignment="right" variant="border-filled"
                                 onselect={handleMenuSelect} class="header-menu" title="More options">
                                 <div class="more-option-container">
                                    <div onclick={handleRefresh} class="refresh-res">
                                       <lightning-menu-item label="Refresh" size="small" alternative-text="Refresh"
                                          class="refresh-icon" onclick={handleRefresh} title="Refresh Conversation">
                                       </lightning-menu-item>
                                    </div>
                                    <lightning-menu-item value="search" label="Search Messages"></lightning-menu-item>
                                    <lightning-menu-item value="starred" label={starMenuLabel}></lightning-menu-item>
                                    <!-- <lightning-menu-item value="pinned" label="Show Pinned Message"></lightning-menu-item> -->
                                    <lightning-menu-item value="download" label="Download Chat Transcript">
                                    </lightning-menu-item>
                                    <!-- <lightning-menu-item value="about" label="About"></lightning-menu-item> -->
                                 </div>
                              </lightning-button-menu>
                           </div>
                        </div>
                     </div>
                  </div>
               </template>
               <template if:true={pinnedMessage}>
                  <div class="pinned-banner slds-p-around_small slds-theme_inverse" onclick={scrollToPinnedMessage}>
                     <lightning-icon icon-name="utility:pin" size="x-small" class="slds-m-right_x-small">
                     </lightning-icon>
                     <span>{pinnedMessage.SmartMsg__Message_Body__c}</span>
                     <lightning-button-icon icon-name="utility:close" size="xx-small" alternative-text="Unpin"
                        onclick={handleUnpinMessage} class="slds-m-left_x-small" style="margin-left: auto">
                     </lightning-button-icon>
                  </div>
               </template>
               <section role="log" class={chatAreaClass}>
                  <lightning-spinner alternative-text="Loading" size="small" variant="brand" if:true={isSpinner}>
                  </lightning-spinner>
                  <template if:true={isMobile}>
                     <template if:true={openFileModal}>
                        <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
                           <div class="slds-modal__container upload-mobile">
                              <header class="slds-modal__header">
                                 <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                                    title="Close">
                                    <lightning-icon icon-name="utility:close" alternative-text="close" size="small"
                                       onclick={closeFileModal}></lightning-icon>
                                    <span class="slds-assistive-text">close</span>
                                 </button>
                                 <h2 class="slds-text-heading_medium">Add Files with Message!</h2>
                              </header>
                              <div class="slds-modal__content slds-p-around_medium">
                                 <lightning-input name="AddFile" label="Attach File" type="file" accept=".png"
                                    onchange={handleFileUploaded} disabled={isAutoReplyEnabled}>
                                 </lightning-input>
                                 <template if:true={fileError}>
                                    <span class="slds-required">{fileError}</span>
                                 </template>
                                 <template if:true={fileName}>
                                    <span style="font-weight: 600;padding: 5px">{fileName}</span>
                                 </template>
                              </div>
                              <div class="slds-text-body_small slds-text-color_weak slds-m-top_small slds-p-horizontal_medium">
                                 Note: Supports JPG/JPEG/PNG/GIF/HEIC images, PDF documents, MP4/MPEG4/MPEG videos (max 600KB per video), and MP3/MP4/MPEG audio.
                                 Max 5 files total size up to 3MB.
                              </div>
                              <footer class="slds-modal__footer">
                                 <lightning-button variant="neutral" label="Cancel"
                                    onclick={closeFileModal}></lightning-button>
                                 <lightning-button variant="brand" label="Upload" onclick={uploadFileData} disabled={isAutoReplyEnabled}
                                    style="margin-left:20px">
                                 </lightning-button>
                              </footer>
                           </div>
                        </section>
                        <!-- <div class="slds-backdrop slds-backdrop_open"></div> -->
                     </template>
                  </template>

                  <template if:true={isSearchActive}>
                     <div class="search-bar-container">
                        <div class="search-bar">
                           <lightning-input type="text" placeholder="Search messages..." class="search-input"
                              variant="label-hidden" value={searchQuery} onchange={handleSearchInput}
                              style="color:#000">
                           </lightning-input>
                           <lightning-button-icon icon-name="utility:close" alternative-text="Close Search"
                              onclick={toggleSearch} class="close-icon"></lightning-button-icon>
                        </div>
                     </div>
                  </template>

                  <h2 class="start-convo" if:false={messages}>{label.START_YOUR_CONVERSATION_LABEL}</h2>
                  <ul class="slds-chat-list">
                     <template if:true={noMessagesFound}>
                        <li>
                           <div class="slds-box slds-theme_alert-texture slds-theme_warning slds-m-around_medium">
                              <lightning-icon icon-name="utility:warning" size="small"
                                 class="slds-m-right_x-small"></lightning-icon>
                              No messages found for the selected phone number.
                           </div>
                        </li>
                     </template>
                     <!-- <template if:false={starredMessageIds}>
                        <h1>There are no starred messages yet !</h1>
                     </template> -->
                     <template if:true={noStarredMessage}>
                        <div class="slds-box slds-theme_alert-texture slds-theme_warning slds-m-around_medium">
                              <lightning-icon icon-name="utility:warning" size="small"
                                 class="slds-m-right_x-small"></lightning-icon>
                              There are no starred messages yet !
                           </div>
                        
                     </template>
                     <template for:each={groupedMessages} for:item="group" for:index="index">
                        <div key={group.date}>
                           <div class="dateContainer">
                              <div class="date">
                                 {group.date}
                              </div>
                           </div>
                           <template for:each={group.messages} for:item="message" for:index="index">
                              <li if:true={message.Incoming} key={message.Id} data-message-id={message.Id}
                                 class="slds-chat-listitem slds-chat-listitem_inbound">
                                 <div class="slds-chat-message message-hover-wrapper-incoming">
                                    <div class="slds-chat-message__body">
                                       <div class="msg-str-container">
                                          <div class="slds-chat-message__text slds-chat-message__text_inbound">
                                             <div class="MediaandMenu">

                                                <template if:true={message.isWhatsApp}>

                                                   <!-- <template if:true={message.isStarred}>
                                                   <lightning-icon icon-name="utility:favorite" variant="brand"
                                                      size="x-small" class="starred-message-icon"
                                                      alternative-text="Starred"></lightning-icon>
                                                   </template> -->
                                                   <template if:true={message.isMedia}>
                                                      <template if:true={message.isImage}>
                                                         <div class="image-message-container">
                                                            <template if:true={message.imageUrl}>
                                                               <img src={message.imageUrl} alt="Image"
                                                                  class="image-message" onclick={openMedia}
                                                                  data-url={message.imageUrl} />
                                                            </template>
                                                            <template if:false={message.imageUrl}>
                                                               <lightning-icon icon-name="doctype:image"
                                                                  alternative-text="Image file" title="Image">
                                                               </lightning-icon>
                                                            </template>
                                                         </div>
                                                      </template>
                                                      <template if:true={message.isPdf}>
                                                         <lightning-icon icon-name="doctype:pdf"
                                                            alternative-text="Image file" title="Image"
                                                            onclick={openMedia} data-url={message.imageUrl}
                                                            style="cursor: pointer">
                                                         </lightning-icon>
                                                      </template>
                                                      <template if:true={message.isVideo}>
                                                         <lightning-icon icon-name="doctype:mp4"
                                                            alternative-text="MP4 file" title="MP4" onclick={openMedia}
                                                            data-url={message.imageUrl} style="cursor: pointer">
                                                         </lightning-icon>
                                                      </template>
                                                      <template if:true={message.isAudio}>
                                                         <lightning-icon icon-name="doctype:audio"
                                                            alternative-text="Audio file" title="Audio"
                                                            onclick={openMedia} data-url={message.imageUrl}
                                                            style="cursor: pointer">
                                                         </lightning-icon>
                                                      </template>
                                                   </template>
                                                   <template if:true={message.isLocation}>
                                                      <div>
                                                         <a href={message.locationUrl} target="_blank">
                                                            <img src={mapImageUrl} alt="Map Image" />
                                                         </a>
                                                         <div style="margin-top: 0.5rem;">
                                                            <a href={message.locationUrl} target="_blank"
                                                               style="text-decoration: none; color: #1a73e8; font-weight: 600;">
                                                               View Location
                                                            </a>
                                                         </div>
                                                         <div>
                                                            <strong
                                                               style="text-decoration: none;">{message.locationName}</strong>
                                                         </div>
                                                      </div>
                                                   </template>

                                                </template>
                                                <!-- <template if:true={message.isImage}>
                                                <span>
                                                <img src={message.base64ImageUrl} alt="Image"
                                                   class="message-image" />
                                                </span>
                                             </template> -->
                                                <div class="inbound-menu-wrapper">
                                                   <lightning-button-icon icon-name="utility:threedots"
                                                      alternative-text="Show actions" variant="bare"
                                                      class="menu-icon incoming-message" data-id={message.Id}
                                                      onclick={handleMenuToggle}>
                                                   </lightning-button-icon>
                                                   <template if:true={message.showMenu}>
                                                      <div class="inbound-custom-dropdown">
                                                         <div class="dropdown-item" onclick={handlePinMessage}
                                                            data-id={message.Id}>{message.pinLabel}</div>
                                                         <div class="dropdown-item" onclick={handleStarMessage}
                                                            data-id={message.Id}>{message.starLabel}</div>
                                                      </div>
                                                   </template>
                                                </div>
                                             </div>
                                             <template if:true={message.isSMS}>
                                                <template if:true={message.SmartMsg__Message_Body__c}>
                                                   <span class="text-bound">
                                                      <lightning-formatted-rich-text
                                                         value={message.SmartMsg__Message_Body__c} class="MessageBody"
                                                         style="padding: 0.3rem 1rem 0rem 0.5rem;"></lightning-formatted-rich-text>
                                                   </span>
                                                </template>
                                                <!-- <template if:true={message.isStarred}>
                                                   <lightning-icon icon-name="utility:favorite" variant="brand"
                                                      size="x-small" class="starred-message-icon"
                                                      alternative-text="Starred"></lightning-icon>
                                                   </template> -->
                                             </template>
                                             <template if:true={message.isWhatsApp}>
                                                <template if:true={message.SmartMsg__Message_Body__c}>
                                                   <template if:true={message.parentMessage}>
                                                      <p>Parent Message</p>
                                                      <div class="reply-container">
                                                         <div class="reply-line"></div>
                                                         <div class="reply-content">
                                                            <div class="reply-label">Replying to</div>
                                                            <template if:true={message.parentMessage.isMedia}>
                                                               <div class="reply-preview">
                                                                  <lightning-icon icon-name="utility:image"
                                                                     size="xx-small"></lightning-icon>
                                                                  <span class="reply-text">Media</span>
                                                               </div>
                                                            </template>
                                                            <template if:false={message.parentMessage.isMedia}>
                                                               <div class="reply-text">
                                                                  “{message.parentMessage.body}”
                                                               </div>
                                                            </template>
                                                         </div>
                                                      </div>
                                                   </template>
                                                   <span class="text-bound">
                                                      <lightning-formatted-rich-text
                                                         value={message.SmartMsg__Message_Body__c} class="MessageBody"
                                                         style="padding: 0.3rem 1rem 0rem 0.5rem;"></lightning-formatted-rich-text>
                                                   </span>
                                                </template>
                                             </template>
                                          </div>
                                          <template if:true={message.isStarred}>
                                             <lightning-icon icon-name="utility:favorite" variant="brand" size="x-small"
                                                class="starred-message-icon-inbound" alternative-text="Starred">
                                             </lightning-icon>
                                          </template>
                                       </div>
                                       <div class="slds-chat-message__meta" aria-label="said Andy Martinez at 5:29 PM">
                                          <template if:true={message.isSMS}>

      <template if:true={openFileModal}>
         <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container upload-desktop">
               <header class="slds-modal__header">
                  <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close">
                     <lightning-icon icon-name="utility:close" alternative-text="close" size="small"
                        onclick={closeFileModal}></lightning-icon>
                     <span class="slds-assistive-text">close</span>
                  </button>
                  <h2 class="slds-text-heading_medium">Add Files with Message!</h2>
               </header>
               <div class="slds-modal__content slds-p-around_medium">
                  <!-- TOGGLE BUTTONS -->
                  <template if:true={isWhatsAppSelected}>
                     <div class="slds-m-bottom_medium slds-align_absolute-center">
                        <lightning-button-group>
                           <lightning-button variant={uploadBtnVariant} label="Upload File"
                              onclick={showFileUpload}></lightning-button>
                           <lightning-button variant={urlBtnVariant} label="Enter URL"
                              onclick={showUrlInput}></lightning-button>
                        </lightning-button-group>
                     </div>
                  </template>
                  <!-- Upload Option -->
                  <template if:true={showFileUploadSection}>
                     <lightning-input name="AddFile" label="Attach File" type="file" accept=".png"
                        onchange={handleFileUploaded} disabled={isAutoReplyEnabled}> </lightning-input>
                     <template if:true={fileNameError}>
                        <p class="slds-text-color_error">File Name is required.</p>
                     </template>
                     <template if:true={fileError}>
                        <p class="slds-text-color_error">{fileError}</p>
                     </template>
                     <template if:true={fileName}>
                        <span style="font-weight: 600;padding: 5px">{fileName}</span>
                     </template>
                  </template>

                  <!-- URL Option -->
                  <template if:true={showUrlInputSection}>
                     <lightning-input label="Public Media URL" value={mediaUrl} data-id="mediaUrlInput"
                        placeholder="e.g. https://example.com/photo.jpg"
                        onchange={handleMediaMessageUrlChange} required></lightning-input>
                     <template if:true={mediaUrlError}>
                        <p class="slds-text-color_error">Valid URL is required.</p>
                     </template>
                  </template>
                  <div class="slds-text-body_small slds-text-color_weak slds-m-top_small slds-p-horizontal_medium">

                     Max 5 files total size up to 3MB.
                  </div>
               </div>

                  <template if:true={fileError}>

                  <template if:true={fileName}>

      </section>
      <div class="slds-backdrop slds-backdrop_open"></div>
